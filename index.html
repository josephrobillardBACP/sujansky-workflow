<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Medicine Workflow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Practice selection screen -->
  <div id="practice-picker" class="practice-picker">
    <div class="picker-container">
      <p class="eyebrow">Concierge Travel Medicine</p>
      <h1 class="picker-title">Travel Medicine Workflow</h1>
      <p class="picker-subtitle">Choose a practice</p>
      <div class="picker-cards" id="picker-cards"></div>
    </div>
  </div>

  <!-- Main app (hidden until practice selected) -->
  <div class="app-shell" id="app-shell" style="display:none">

    <header class="page-header">
      <div class="header-text">
        <button id="switch-practice-btn" class="switch-practice-btn" type="button">← Switch Practice</button>
        <h1 id="dashboard-title">Patient Workflow Dashboard</h1>
        <p class="practice-name" id="practice-name"></p>
      </div>
      <div class="header-actions">
        <a id="sheet-link" href="#" target="_blank" rel="noopener noreferrer" class="sheet-link">View Responses ↗</a>
        <span id="sync-status" data-state="syncing">Connecting…</span>
      </div>
    </header>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="list-controls">
      <input
        id="search"
        type="search"
        placeholder="Search by patient name or destination…"
        class="search-input"
        oninput="onSearch()"
        autocomplete="off"
      />
      <button id="create-patient-btn" class="create-patient-btn" type="button">+ Create New Patient</button>
    </div>

    <div class="practice-filters" id="practice-filters" role="tablist" aria-label="Practice filter" style="display:none"></div>

    <div id="archive-drawer"></div>

    <section>
      <div id="patient-list" class="patient-list"></div>
    </section>

  </div>

  <!-- Create Patient Modal -->
  <div id="create-patient-modal" class="cp-modal" style="display:none">
    <div class="cp-modal-backdrop" id="cp-modal-backdrop"></div>
    <div class="cp-modal-card" role="dialog" aria-modal="true" aria-labelledby="cp-modal-title">
      <div class="cp-modal-header">
        <h2 id="cp-modal-title">Create New Patient</h2>
        <button type="button" id="cp-modal-close" class="cp-modal-close" aria-label="Close">×</button>
      </div>

      <form id="cp-form" class="cp-form" novalidate>
        <div class="cp-field">
          <label for="cp-name">Patient Name <span class="cp-req">*</span></label>
          <input type="text" id="cp-name" name="name" required autocomplete="off" />
        </div>

        <div class="cp-field" id="cp-physician-field">
          <label for="cp-physician">Physician <span class="cp-req">*</span></label>
          <select id="cp-physician" name="physician">
            <option value="">Select physician…</option>
          </select>
        </div>

        <fieldset class="cp-fieldset">
          <legend>Travel Locations <span class="cp-req">*</span></legend>
          <div id="cp-locations"></div>
          <button type="button" id="cp-add-location" class="cp-add-btn">+ Add Location</button>
        </fieldset>

        <div class="cp-field">
          <label for="cp-notes">Notes to be aware of</label>
          <textarea id="cp-notes" name="notes" rows="3" placeholder="Any concerns, medical history, or context the team should know…"></textarea>
        </div>

        <div class="cp-actions">
          <button type="button" id="cp-cancel" class="cp-btn cp-btn-secondary">Cancel</button>
          <button type="submit" id="cp-submit" class="cp-btn cp-btn-primary">Create Patient</button>
        </div>
      </form>
    </div>
  </div>

  <script src="workflow-data.js?v=12"></script>
  <script src="daniher-workflow-data.js?v=12"></script>
  <script src="staff-workflow-data.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
