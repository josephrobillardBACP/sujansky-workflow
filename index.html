<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Medicine Workflow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Practice selection screen -->
  <div id="practice-picker" class="practice-picker">
    <div class="picker-container">
      <p class="eyebrow">Concierge Travel Medicine</p>
      <h1 class="picker-title">Travel Medicine Workflow</h1>
      <p class="picker-subtitle">Choose a practice</p>
      <div class="picker-cards" id="picker-cards"></div>
    </div>
  </div>

  <!-- Main app (hidden until practice selected) -->
  <div class="app-shell" id="app-shell" style="display:none">

    <header class="page-header">
      <div class="header-text">
        <button id="switch-practice-btn" class="switch-practice-btn" type="button">← Switch Practice</button>
        <h1 id="dashboard-title">Patient Workflow Dashboard</h1>
        <p class="practice-name" id="practice-name"></p>
      </div>
      <div class="header-actions">
        <a id="sheet-link" href="#" target="_blank" rel="noopener noreferrer" class="sheet-link">View Responses ↗</a>
        <span id="sync-status" data-state="syncing">Connecting…</span>
      </div>
    </header>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="list-controls">
      <input
        id="search"
        type="search"
        placeholder="Search by patient name or destination…"
        class="search-input"
        oninput="onSearch()"
        autocomplete="off"
      />
    </div>

    <div class="practice-filters" id="practice-filters" role="tablist" aria-label="Practice filter" style="display:none"></div>

    <div id="archive-drawer"></div>

    <section>
      <div id="patient-list" class="patient-list"></div>
    </section>

  </div>

  <script src="workflow-data.js?v=10"></script>
  <script src="daniher-workflow-data.js?v=10"></script>
  <script src="staff-workflow-data.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
